<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101820">
    <title>Experiência por localização — A-Frame</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            color: #fff;
            font-family: system-ui, sans-serif;
        }

        header {
            position: fixed;
            z-index: 2;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem clamp(1rem, 5vw, 3rem);
            background: linear-gradient(#101820ee, #10182000);
            pointer-events: none;
        }

        h1 {
            margin: 0 0 0.4rem;
            font-size: clamp(1.25rem, 3vw, 1.75rem);
        }

        p {
            max-width: 48rem;
            margin: 0 0 0.35rem;
        }

        a {
            color: #fff;
            font-weight: 600;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Experiência por localização</h1>
        <p>Permite o acesso à câmara e à localização. O objeto aparece perto de 41.5000, -8.0000.</p>
        <p>Esta página tem de ser aberta através de HTTPS e só funciona nas proximidades dessas coordenadas.</p>
        <a href="../">Voltar à página inicial</a>
    </header>

    <a-scene
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
        renderer="antialias: true; alpha: true">

        <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

        <a-box
            color="green"
            depth="5"
            height="5"
            width="5"
            gps-new-entity-place="latitude: 41.5000; longitude: -8.0000">
        </a-box>
    </a-scene>
</body>
</html>

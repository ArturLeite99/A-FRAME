<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>A-FRAME — A minha primeira cena</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-box
      position="-1 0.5 -3"
      rotation="0 45 0"
      color="#6E5049">
    </a-box>
    <a-sphere
      position="0 1.25 -5"
      radius="1.25"
      color="#686E49">
    </a-sphere>
    <a-cylinder
      position="1 0.75 -3"
      radius="0.5"
      height="1.5"
      color="#496B6E">
    </a-cylinder>
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="4"
      height="4"
      color="#DB7FD8">
    </a-plane>
    <a-text
      value="Hello, Artur!"
      position="-1 2.8 -4"
      color="#CCCCCC"
      width="6">
    </a-text>
    <a-sky color="#68D1E8"></a-sky>
  </a-scene>
</body>
</html>
